name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Tidy
        run: go mod tidy -diff
      - name: Runtime contract generation
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          go generate ./runtimecontract/...
          git diff --exit-code -- runtimecontract
      - name: Runtime contract compatibility
        if: github.event_name == 'pull_request'
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for current in runtimecontract/v*/openapi.yaml; do
            [ -f "$current" ] || continue
            if git cat-file -e "$BASE_SHA:$current" 2>/dev/null; then
              go run github.com/oasdiff/oasdiff@v1.32.1 breaking "$BASE_SHA:$current" "$current" --fail-on ERR
            fi
          done
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: MCP Apps
        run: node --test mcpapps/image.test.mjs
      - name: Race
        run: go test -race ./... -count=1
      - name: Build
        run: go build ./...
